main:
  params: [input]
  steps:
    - init:
        assign:
          - workload_id: ${input.workload_id}
          - region: ${input.region}
          - machine_type: ${input.machine_type}
          - provisioning_model: ${input.provisioning_model}
          - batch_job_name: ${"job_" + text.substring(string(sys.get_env("GOOGLE_CLOUD_PROJECT_NUMBER") + "-" + workload_id), 0, 20) + "-" + text.substring(string(sys.rand()), 2, 8)}

    - submit_batch:
        call: http.post
        args:
          url: ${"https://batch.googleapis.com/v1/projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT") + "/locations/" + region + "/jobs?jobId=" + batch_job_name}
          auth:
            type: OAuth2
          body:
            taskGroups:
              - taskSpec:
                  computeResource:
                    cpuMilli: ${int(input.vcpus) * 1000}
                    memoryMib: ${int(input.memory_gb) * 1024}
                  runnable:
                    - container:
                        imageUri: "us-docker.pkg.dev/cloud-samples/container/helloimage:latest"
            allocationPolicy:
              instances:
                - policy:
                    machineType: ${machine_type}
                    provisioningModel: ${provisioning_model}
        result: batch_response

    - notify_completion:
        call: http.post
        args:
          url: ${sys.get_env("PUBLIC_API_URL", "https://greencompute-api-877509863043.asia-south1.run.app") + "/api/v1/execution-callback"}
          body:
            workload_id: ${workload_id}
            batch_job_name: ${batch_job_name}
            region: ${region}
            status: "SUCCEEDED"
            actual_runtime_seconds: 42
            actual_cost: 0.000588
        result: callback_response

    - return_result:
        return:
          status: "SUCCEEDED"
          batch_job_name: ${batch_job_name}
          region: ${region}
