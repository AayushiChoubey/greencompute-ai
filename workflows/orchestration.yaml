main:
  params: [args]
  steps:
    - initVariables:
        assign:
          - api_base_url: ${args.api_base_url}
          - workload: ${args.workload}
          - max_retries: 20
          - retry_count: 0
          - sleep_seconds: 5

    # 1. Optimize workload via GreenCompute API
    - runOptimizer:
        call: http.post
        args:
          url: ${api_base_url + "/api/v1/optimize"}
          body: ${workload}
        result: opt_response

    - extractCandidate:
        assign:
          - selected: ${opt_response.body.selected_candidate}
          - opt_run_id: ${opt_response.body.optimization_run_id}
          - selected_region: ${selected.region}
          - machine_type: ${selected.machine_type}
          - provisioning_model: ${selected.provisioning_model}
          - estimated_cost: ${selected.estimated_compute_cost_usd}
          - est_minutes: ${default(workload.estimated_runtime_minutes, 60)}
          - hourly_rate: ${selected.estimated_compute_cost_usd * (60.0 / est_minutes)}

    # 2. Dispatch the chosen plan to Google Cloud Batch
    - dispatchExecution:
        call: http.post
        args:
          url: ${api_base_url + "/api/v1/execute"}
          body:
            workload_id: ${workload.workload_id}
            decision_id: ${selected.candidate_id}
            optimization_run_id: ${opt_run_id}
            selected_candidate: ${selected}
        result: exec_response

    - extractExecutionMeta:
        assign:
          - batch_job_name: ${exec_response.body.batch_job_name}
          - exec_attempt_id: ${exec_response.body.execution_attempt_id}

    # 3. Poll Batch API until execution reaches a terminal state
    - pollBatchJobStatus:
        call: http.get
        args:
          url: ${"https://batch.googleapis.com/v1/" + batch_job_name}
          auth:
            type: OAuth2
        result: batch_job_desc

    - assignJobState:
        assign:
          - job_state: ${batch_job_desc.body.status.state}

    - checkJobState:
        switch:
          - condition: ${job_state == "SUCCEEDED" or job_state == "FAILED" or job_state == "DELETION_IN_PROGRESS"}
            next: extractTimestamps
          - condition: ${retry_count < max_retries}
            next: incrementRetry
        next: handleTimeout

    - incrementRetry:
        assign:
          - retry_count: ${retry_count + 1}

    - sleepStep:
        call: sys.sleep
        args:
          seconds: ${sleep_seconds}
        next: pollBatchJobStatus

    - handleTimeout:
        assign:
          - job_state: "TIMED_OUT"
        next: extractTimestamps

    # 4. Compute runtime seconds from timestamps and calculate prorated actual cost
    - extractTimestamps:
        assign:
          - create_time_str: ${batch_job_desc.body.createTime}
          - update_time_str: ${default(batch_job_desc.body.updateTime, batch_job_desc.body.createTime)}

    - parseTimestamps:
        assign:
          - start_ts: ${time.parse(create_time_str)}
          - end_ts: ${time.parse(update_time_str)}

    - computeDelta:
        assign:
          - delta_raw: ${int(end_ts - start_ts)}

    - sanitizeMetrics:
        assign:
          - actual_seconds: ${int(math.max(delta_raw, 1))}
          - actual_cost: ${double(hourly_rate * (actual_seconds / 3600.0))}

    # 5. Send status callback to log real runtime in BigQuery execution ledger
    - notifyCallback:
        call: http.post
        args:
          url: ${api_base_url + "/api/v1/execution-callback"}
          body:
            workload_id: ${workload.workload_id}
            decision_id: ${selected.candidate_id}
            execution_attempt_id: ${exec_attempt_id}
            batch_job_name: ${batch_job_name}
            region: ${selected_region}
            status: ${job_state}
            actual_runtime_seconds: ${actual_seconds}
            actual_cost: ${actual_cost}
            correlation_id: ${opt_run_id}
        result: callback_result

    # 6. Generate Gemini explainability synthesis
    - fetchGeminiExplanation:
        call: http.post
        args:
          url: ${api_base_url + "/api/v1/explain"}
          body:
            workload: ${workload}
            selected_candidate: ${selected}
            candidates: ${opt_response.body.candidates}
        result: explain_response

    # 7. Terminal return payload
    - returnResult:
        return:
          workload_id: ${workload.workload_id}
          optimization_run_id: ${opt_run_id}
          region: ${selected_region}
          machine_type: ${machine_type}
          provisioning_model: ${provisioning_model}
          status: ${job_state}
          batch_job_name: ${batch_job_name}
          actual_runtime_seconds: ${actual_seconds}
          actual_cost: ${actual_cost}
          estimated_cost: ${estimated_cost}
          gemini_explanation: ${explain_response.body.explanation}
